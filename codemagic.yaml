workflows:
  release-build:
    name: Release Build (iOS & Android)

    environment:
      groups:
        - firebase_credentials
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Deep clean and prepare
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ios/Flutter/Flutter.podspec
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      - name: Use static Podfile (disable SPM)
        script: |
          # Đảm bảo Podfile đã tồn tại trong repo (không xóa nó)
          # Nếu cần, có thể copy từ file mẫu
          cp ios/Podfile ios/Podfile.bak  # backup
          # Sửa lại nếu cần
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/g' ios/Podfile
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
