workflows:
  release-build:
    name: Release Build (iOS & Android)
    environment:
      groups:
        - firebase_credentials   # Chứa biến IOS_FIREBASE_SECRET
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean and get dependencies
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock   # Xóa cache cũ
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      - name: Fix Podfile for static frameworks (tránh lỗi EXC_BAD_ACCESS)
        script: |
          # Thay dòng use_frameworks! thành static linkage
          sed -i '' 's/use_frameworks!/use_frameworks! :linkage => :static/g' ios/Podfile

      - name: Reset and install CocoaPods
        script: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Verify Bundle ID (kiểm tra trước khi build)
        script: |
          echo "Bundle ID trong Info.plist:"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" ios/Runner/Info.plist
          echo "Bundle ID trong project.pbxproj:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | head -1

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

      - name: Build iOS IPA
        script: |
          # --no-codesign để không yêu cầu provisioning profile
          flutter build ipa --release --no-codesign

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive   # Có thể giữ lại để debug
