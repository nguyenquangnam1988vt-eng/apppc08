workflows:
  release-build:
    name: Release Build (iOS & Android)

    environment:
      groups:
        - firebase_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      # ⬇️⬇️⬇️ THÊM DÒNG NÀY ĐỂ TẮT SPM ⬇️⬇️⬇️
      FLUTTER_USE_SWIFT_PACKAGE_MANAGER: false

    scripts:
      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Clean and get dependencies
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      # ⬇️⬇️⬇️ BƯỚC MỚI: XÓA PODFILE CŨ ⬇️⬇️⬇️
      - name: Remove old Podfile (let Flutter regenerate)
        script: |
          rm -f ios/Podfile
          echo "Đã xóa Podfile cũ, Flutter sẽ tạo mới khi build."

      - name: Install CocoaPods
        script: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
