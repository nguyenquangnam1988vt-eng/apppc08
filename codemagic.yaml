workflows:
  release-build:
    name: Release Build (iOS & Android)

    environment:
      groups:
        - firebase_credentials
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:

      - name: Show build environment
        script: |
          echo "===== FLUTTER ====="
          flutter --version
          echo "===== XCODE ====="
          xcodebuild -version
          echo "===== COCOAPODS ====="
          pod --version
          echo "===== DART ====="
          dart --version

      - name: Clean and get dependencies
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Verify Bundle ID
        script: |
          echo "Bundle ID trong Info.plist:"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" ios/Runner/Info.plist
          echo "Bundle ID trong project.pbxproj:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | head -1

      # ⬇️⬇️⬇️ BỔ SUNG BƯỚC SỬA TÊN PRODUCT ⬇️⬇️⬇️
      - name: Fix Product Name and Executable Name
        script: |
          sed -i '' 's/PRODUCT_NAME = .*;/PRODUCT_NAME = Runner;/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Runner" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" ios/Runner/Info.plist
          echo "Đã sửa Product Name thành Runner"

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

      - name: Validate IPA structure
        script: |
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA found!"
            exit 1
          fi
          echo "Checking IPA: $IPA_FILE"
          if unzip -l "$IPA_FILE" | grep -q "Payload/.*\.app/Info.plist"; then
            echo "✅ IPA structure is valid"
          else
            echo "❌ IPA missing Info.plist inside Payload"
            exit 1
          fi

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
