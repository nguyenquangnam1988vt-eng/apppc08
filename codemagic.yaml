workflows:
  release-build:
    name: Release Build (iOS)

    environment:
      groups:
        - firebase_credentials

      flutter: 3.47.2
      xcode: 26.4
      cocoapods: 1.16.2

    scripts:

      - name: Show build environment
        script: |
          echo "===== FLUTTER ====="
          flutter --version

          echo "===== DART ====="
          dart --version

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== COCOAPODS ====="
          pod --version

      - name: Deep clean
        script: |
          flutter clean

          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral

          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" \
            > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod install --repo-update

          cd ..

      - name: Verify CocoaPods
        script: |
          echo "===== PODFILE.LOCK ====="
          test -f ios/Podfile.lock && echo "Podfile.lock OK"

          echo "===== MANIFEST.LOCK ====="
          test -f ios/Pods/Manifest.lock && echo "Manifest.lock OK"

          echo "===== PATH PROVIDER ====="
          grep -A 5 -B 2 "path_provider_foundation" ios/Podfile.lock || true

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
