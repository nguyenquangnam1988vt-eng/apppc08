workflows:
  release-build:
    name: Release Build (iOS & Android)

    environment:
      groups:
        - firebase_credentials

      flutter: 3.47.2
      xcode: 26.4
      cocoapods: 1.16.2

    scripts:

      - name: Show build environment
        script: |
          echo "===== FLUTTER ====="
          flutter --version

          echo "===== DART ====="
          dart --version

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== COCOAPODS ====="
          pod --version

      - name: Check pubspec
        script: |
          echo "===== PUBSPEC ====="
          cat pubspec.yaml

      - name: Clean and get dependencies
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          printf '%s\n' "$IOS_FIREBASE_SECRET" \
            > ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods
          pod install --repo-update
          cd ..

      - name: Verify Pods
        script: |
          echo "===== PATH PROVIDER FOUNDATION ====="
          grep -A 5 -B 2 "path_provider_foundation" ios/Podfile.lock || true

      - name: Verify Bundle ID
        script: |
          /usr/libexec/PlistBuddy \
            -c "Print CFBundleIdentifier" \
            ios/Runner/Info.plist

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
