workflows:
  release-build:
    name: Release Build (iOS)

    environment:
      groups:
        - firebase_credentials

      flutter: 3.47.2
      xcode: 26.4
      cocoapods: 1.16.2

    scripts:

      - name: Show build environment
        script: |
          set -e

          echo "===== FLUTTER ====="
          flutter --version

          echo "===== DART ====="
          dart --version

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== COCOAPODS ====="
          pod --version

      - name: Deep clean
        script: |
          set -e

          flutter clean

          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get Flutter dependencies
        script: |
          set -e

          flutter pub get

      - name: Create GoogleService-Info.plist
        script: |
          set -e

          echo "$IOS_FIREBASE_SECRET" | base64 --decode > ios/Runner/GoogleService-Info.plist

          test -s ios/Runner/GoogleService-Info.plist

          echo "GoogleService-Info.plist OK"
          ls -lh ios/Runner/GoogleService-Info.plist

      - name: Verify Firebase plist
        script: |
          set -e

          PLIST="ios/Runner/GoogleService-Info.plist"

          test -f "$PLIST"

          echo "===== FIREBASE PLIST ====="

          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$PLIST" || true

          echo "Firebase plist verification completed."

      - name: Install CocoaPods
        script: |
          set -e

          cd ios

          rm -rf Pods
          rm -f Podfile.lock

          pod install --repo-update

          cd ..

      - name: Verify CocoaPods
        script: |
          set -e

          echo "===== PODFILE.LOCK ====="
          test -f ios/Podfile.lock
          echo "Podfile.lock OK"

          echo "===== MANIFEST.LOCK ====="
          test -f ios/Pods/Manifest.lock
          echo "Manifest.lock OK"

          echo "===== PATH PROVIDER FOUNDATION ====="
          grep -A 5 -B 2 "path_provider_foundation" ios/Podfile.lock || true

      - name: Build unsigned iOS archive
        script: |
          set -e

          rm -rf build/ios/archive
          mkdir -p build/ios/archive

          echo "===== BUILD UNSIGNED ARCHIVE ====="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          echo "===== ARCHIVE CREATED ====="

          test -d "build/ios/archive/Runner.xcarchive"

          test -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          echo "Runner.xcarchive OK"
          echo "Runner.app OK"

      - name: Verify Runner.app
        script: |
          set -e

          APP="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          echo "===== RUNNER.APP ====="

          test -d "$APP"

          echo "App size:"
          du -sh "$APP"

          echo "===== FRAMEWORKS ====="
          ls -lah "$APP/Frameworks" || true

          echo "===== FIREBASE PLIST INSIDE APP ====="

          if [ -f "$APP/GoogleService-Info.plist" ]; then
            echo "GoogleService-Info.plist FOUND inside Runner.app"
            ls -lh "$APP/GoogleService-Info.plist"
          else
            echo "WARNING: GoogleService-Info.plist NOT found inside Runner.app"
          fi

      - name: Create unsigned IPA for Sideloadly
        script: |
          set -e

          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          IPA_DIR="build/ios/ipa"
          PAYLOAD_DIR="build/ios/Payload"

          echo "===== PREPARE IPA ====="

          test -d "$APP_PATH"

          rm -rf "$IPA_DIR"
          rm -rf "$PAYLOAD_DIR"

          mkdir -p "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/Runner.app"

          echo "===== CREATE IPA ====="

          cd build/ios

          /usr/bin/zip -qry \
            "ipa/Runner-unsigned.ipa" \
            Payload

          cd ../..

          echo "===== IPA CREATED ====="

          test -f "build/ios/ipa/Runner-unsigned.ipa"

          ls -lh "build/ios/ipa/Runner-unsigned.ipa"

      - name: Verify unsigned IPA
        script: |
          set -e

          IPA="build/ios/ipa/Runner-unsigned.ipa"

          echo "===== IPA ====="

          test -f "$IPA"

          ls -lh "$IPA"

          echo "===== IPA CONTENT ====="

          unzip -l "$IPA" | head -50

          echo "===== IPA READY FOR SIDELOADLY ====="

    artifacts:
      - build/ios/ipa/Runner-unsigned.ipa
      - build/ios/archive/Runner.xcarchive
