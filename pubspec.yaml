name: app7
description: A real-time location tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Map
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Device Location
  geolocator: ^14.0.2
  # Firebase Backend (Đồng bộ firebase_core lên v3.x và firebase_database lên v11.x để khớp với firebase_auth v5.x)
  firebase_core: ^3.0.0
  firebase_database: ^11.0.0
  firebase_auth: ^5.0.0
  #path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
