name: app7
description: A real-time location tracking application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  firebase_core: ^3.0.0
  firebase_database: ^11.0.0
  firebase_auth: ^5.0.0
  path_provider: ^2.1.6   # Nâng cấp lên phiên bản mới nhất trong dòng 2.1.x

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# BỎ HOÀN TOÀN PHẦN dependency_overrides
flutter:
  uses-material-design: true
